name: Visual tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble   # must match @playwright/test in package.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test
        env:
          HOME: /root   # Playwright in containers can need this

      - uses: actions/upload-artifact@v4
        if: always()    # keep the report even when tests fail
        with:
          name: playwright-results
          retention-days: 1
          path: |
            playwright-report/
            test-results/
